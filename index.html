<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Client</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0d;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    /* VERSION SCREEN */

    #launcher {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 55px 7%;
      background:
        radial-gradient(circle at top left, #25252b 0, transparent 35%),
        linear-gradient(135deg, #0b0b0d, #111116);
    }

    .top {
      max-width: 1100px;
      margin: auto;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .sub {
      margin-top: 8px;
      color: #888;
      font-size: 15px;
    }

    .versions {
      max-width: 1100px;
      margin: 35px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 15px;
    }

    .version {
      background: #151519;
      border: 1px solid #29292f;
      border-radius: 12px;
      padding: 22px;
      cursor: pointer;
      transition: .15s ease;
    }

    .version:hover {
      transform: translateY(-3px);
      border-color: #55555e;
      background: #1a1a1f;
    }

    .version h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .version p {
      margin: 0;
      color: #85858d;
      font-size: 13px;
    }

    .launch {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    .launch:hover {
      background: #ddd;
    }

    /* GAME */

    #game {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }

    #client {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      height: 44px;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 10px 0 15px;

      background: rgba(15,15,18,.92);
      border: 1px solid #303038;
      border-radius: 9px;

      opacity: 0;
      transition: opacity .2s;
    }

    #game:hover .bar {
      opacity: 1;
    }

    .bar-title {
      font-size: 13px;
      color: #aaa;
    }

    .bar button {
      border: 0;
      border-radius: 6px;
      padding: 7px 11px;
      background: #24242a;
      color: white;
      cursor: pointer;
    }

    .bar button:hover {
      background: #33333b;
    }

    /* ERROR */

    #error {
      display: none;
      max-width: 700px;
      margin: 100px auto;
      padding: 25px;
      background: #17171b;
      border: 1px solid #38383f;
      border-radius: 12px;
    }

    #error h2 {
      margin-top: 0;
    }

    #error p {
      color: #aaa;
      line-height: 1.5;
    }

    code {
      background: #09090b;
      padding: 3px 6px;
      border-radius: 5px;
    }

    @media (max-width: 600px) {
      #launcher {
        padding: 35px 20px;
      }

      .logo {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <!-- VERSION SELECTOR -->

  <main id="launcher">

    <div class="top">
      <div class="logo">Minecraft Client</div>
      <div class="sub">Select a version to continue</div>
    </div>

    <section class="versions">

      <!--
        Change the paths below to where your ACTUAL
        browser Minecraft client files are located.
      -->

      <div class="version">
        <h2>1.8.9</h2>
        <p>Classic client</p>

        <button
          class="launch"
          onclick="launch('1.8.9', 'client-1.8.9/index.html')">
          Launch
        </button>
      </div>

      <div class="version">
        <h2>1.12.2</h2>
        <p>Classic / modded era</p>

        <button
          class="launch"
          onclick="launch('1.12.2', 'client-1.12.2/index.html')">
          Launch
        </button>
      </div>

      <div class="version">
        <h2>1.20.4</h2>
        <p>Modern client</p>

        <button
          class="launch"
          onclick="launch('1.20.4', 'client-1.20.4/index.html')">
          Launch
        </button>
      </div>

      <div class="version">
        <h2>1.21</h2>
        <p>Latest client</p>

        <button
          class="launch"
          onclick="launch('1.21', 'client-1.21/index.html')">
          Launch
        </button>
      </div>

    </section>

    <div id="error">
      <h2>Client not found</h2>

      <p id="errorText"></p>

      <button class="launch" onclick="back()">
        Back
      </button>
    </div>

  </main>


  <!-- GAME -->

  <section id="game">

    <div class="bar">
      <div class="bar-title" id="gameTitle">
        Minecraft
      </div>

      <div>
        <button onclick="fullscreen()">
          Fullscreen
        </button>

        <button onclick="back()">
          Exit
        </button>
      </div>
    </div>

    <iframe
      id="client"
      allow="fullscreen; gamepad; autoplay"
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock">
    </iframe>

  </section>


  <script>

    const launcher = document.getElementById("launcher");
    const game = document.getElementById("game");
    const client = document.getElementById("client");
    const gameTitle = document.getElementById("gameTitle");
    const error = document.getElementById("error");
    const errorText = document.getElementById("errorText");


    function launch(version, path) {

      error.style.display = "none";

      /*
       * GitHub Pages serves files relative to your repository.
       *
       * Example:
       *
       * your-repo/
       *   index.html
       *
       *   client-1.8.9/
       *     index.html
       *
       *   client-1.20.4/
       *     index.html
       */

      const url = new URL(path, window.location.href).href;

      gameTitle.textContent = "Minecraft " + version;

      client.src = url;

      launcher.style.display = "none";
      game.style.display = "block";

      document.body.style.overflow = "hidden";

      client.onerror = function () {
        showError(
          "The browser client could not be loaded from:<br><br>" +
          "<code>" + url + "</code>"
        );
      };
    }


    function showError(message) {
      game.style.display = "none";
      launcher.style.display = "block";

      error.style.display = "block";
      errorText.innerHTML = message;
    }


    function back() {

      client.src = "";

      game.style.display = "none";
      launcher.style.display = "block";

      error.style.display = "none";

      document.body.style.overflow = "auto";
    }


    function fullscreen() {

      if (game.requestFullscreen) {
        game.requestFullscreen();
      }
      else if (client.requestFullscreen) {
        client.requestFullscreen();
      }
    }


    /*
     * If somebody opens a client path directly,
     * don't leave an empty iframe behind.
     */

    window.addEventListener("message", function(event) {
      console.log("Client message:", event.data);
    });

  </script>

</body>
</html>
